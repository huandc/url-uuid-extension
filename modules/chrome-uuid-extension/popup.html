<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL UUID 工具</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>URL UUID</h1>
        <p class="subtitle">提取与替换当前页面 UUID</p>
      </div>
    </header>

    <section class="card">
      <details class="settings">
        <summary class="settings-summary">
          <div>
            <div class="switch-title">设置</div>
            <div class="switch-desc">UUID 格式 / 界面主题 / 悬浮按钮</div>
          </div>
          <span class="settings-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </summary>
        <div class="settings-body">
          <label class="label" for="formatSelect">UUID 格式</label>
          <select id="formatSelect" class="select">
            <option value="dashed">UUID（带 -）</option>
            <option value="compact">UUID（不带 -）</option>
            <option value="custom">自定义格式（正则）</option>
          </select>
          <div id="regexRow" class="regex-row hidden">
            <label class="label" for="regexInput">正则表达式</label>
            <input
              id="regexInput"
              class="input"
              type="text"
              placeholder="例如：[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
              spellcheck="false"
              autocomplete="off"
            />
            <p id="regexError" class="error hidden"></p>
          </div>
          <div class="switch-row">
            <div>
              <div class="switch-title">显示悬浮按钮</div>
              <div class="switch-desc">页面含 UUID 时右下角可拖动复制</div>
            </div>
            <label class="switch" for="fabVisibleToggle">
              <input id="fabVisibleToggle" type="checkbox" checked />
              <span class="switch-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="theme-row">
            <div>
              <div class="switch-title">界面主题</div>
              <div class="switch-desc">白色 / 黑色 / 跟随系统</div>
            </div>
            <select id="themeSelect" class="select theme-select">
              <option value="system">跟随系统</option>
              <option value="light">白色</option>
              <option value="dark">黑色</option>
            </select>
          </div>
        </div>
      </details>
    </section>

    <section class="card">
      <label class="label">当前 UUID</label>
      <div class="uuid-row">
        <code id="currentUuid" class="uuid-value" title="">—</code>
        <button id="copyBtn" class="btn btn-ghost" type="button" disabled>
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span id="copyLabel">复制</span>
        </button>
      </div>
      <p id="urlHint" class="hint"></p>
    </section>

    <section class="card">
      <label class="label" for="uuidInput">替换为</label>
      <input
        id="uuidInput"
        class="input"
        type="text"
        placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        spellcheck="false"
        autocomplete="off"
      />
      <p id="inputError" class="error hidden"></p>
      <button id="applyBtn" class="btn btn-primary" type="button" disabled>
        确定并刷新
      </button>
    </section>

    <footer class="footer">
      <span id="status" class="status"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
